name: Validate Addons

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-addons:
    name: validate-addons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: pr-head

      - name: Checkout trusted base validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.base_ref || 'main' }}
          path: .base

      - name: Checkout Flight3d runtime validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stlim0727/flight3d
          path: .flight3d

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Install Flight3d validator dependencies
        run: npm ci --prefix .flight3d

      - name: Validate addons and build PR preview bundle
        env:
          # GLTFLoader reads self.URL when parsing GLBs with embedded textures.
          NODE_OPTIONS: "--import data:text/javascript,globalThis.self=globalThis"
        run: |
          node .base/scripts/validate-pr.mjs \
            --addons-dir pr-head/addons \
            --flight3d-dir .flight3d \
            --core 1.8.0 \
            --pr "${{ github.event.pull_request.number || 0 }}" \
            --head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --preview-base-url "https://stlim0727.github.io/flight3d-addons/previews" \
            --out-dir preview-bundle
      - name: Upload verified PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-preview
          path: preview-bundle
          retention-days: 7
