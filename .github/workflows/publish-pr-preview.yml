name: Publish PR Preview

on:
  workflow_run:
    workflows: ["Validate Addons"]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish-pr-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages

      - name: Update or clean up PR preview on gh-pages
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');

            fs.mkdirSync('previews', { recursive: true });

            if (context.eventName === 'pull_request_target') {
              const prNumber = context.payload.pull_request?.number;
              if (!prNumber) return;
              fs.rmSync(path.join('previews', `pr-${prNumber}.json`), { force: true });
              fs.rmSync(path.join('previews', `pr-${prNumber}`), { recursive: true, force: true });
              return;
            }

            const run = context.payload.workflow_run;
            if (!run || run.event !== 'pull_request') return;
            const pr = run.pull_requests?.[0];
            if (!pr?.number) return;
            const prNumber = pr.number;
            const headSha = run.head_sha;
            const previewFile = path.join('previews', `pr-${prNumber}.json`);
            const previewDir = path.join('previews', `pr-${prNumber}`);

            if (run.conclusion !== 'success') {
              fs.rmSync(previewDir, { recursive: true, force: true });
              const failedDoc = {
                schemaVersion: 1,
                prNumber,
                headSha,
                ciPassed: false,
                checkName: 'validate-addons',
                updatedAt: new Date().toISOString(),
                catalog: { schemaVersion: 1, addons: [] },
              };
              fs.writeFileSync(previewFile, JSON.stringify(failedDoc, null, 2) + '\n', 'utf8');
              return;
            }

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            const target = artifacts.artifacts.find(a => a.name === 'pr-preview' && !a.expired);
            if (!target) {
              core.setFailed(`pr-preview artifact missing for run ${run.id}`);
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: target.id,
              archive_format: 'zip',
            });
            const zipPath = path.join('/tmp', `pr-${prNumber}.zip`);
            const extractDir = path.join('/tmp', `pr-${prNumber}-extract`);
            fs.rmSync(extractDir, { recursive: true, force: true });
            fs.mkdirSync(extractDir, { recursive: true });
            fs.writeFileSync(zipPath, Buffer.from(download.data));
            execFileSync('unzip', ['-qo', zipPath, '-d', extractDir]);

            fs.rmSync(previewDir, { recursive: true, force: true });
            const extractedJson = path.join(extractDir, `pr-${prNumber}.json`);
            const extractedDir = path.join(extractDir, `pr-${prNumber}`);
            if (fs.existsSync(extractedJson)) {
              fs.copyFileSync(extractedJson, previewFile);
            }
            if (fs.existsSync(extractedDir)) {
              fs.cpSync(extractedDir, previewDir, { recursive: true });
            }

      - name: Commit and push gh-pages preview update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A previews
          if git diff --cached --quiet; then
            echo "No preview changes to publish"
            exit 0
          fi
          git commit -m "chore(previews): update PR preview"
          git push origin gh-pages
